<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Tommy's Beauty Essentials</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="images/favicon.jpeg">
</head>

<body>

<header>

<header class="site-header">

    <div class="header-main">

        <a href="index.html" class="brand-name">
            Tommy's Beauty Essentials
        </a>

        <div class="header-actions">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                    onkeyup="searchProducts()">
            </div>

            <a href="cart.html" class="header-cart" id="cart-link">
                🛒 <span>Cart (0)</span>
            </a>

            <button
                class="mobile-menu-btn"
                onclick="toggleMenu()"
                aria-label="Open navigation menu">
                ☰
            </button>

        </div>

    </div>

</header>

<!-- SIDE NAVIGATION -->

<div class="menu-overlay" onclick="toggleMenu()"></div>

<aside id="mainNav" class="side-menu">

    <div class="side-menu-header">

        <h2>Tommy's Beauty Essentials</h2>

        <button
            class="close-menu-btn"
            onclick="toggleMenu()"
            aria-label="Close navigation menu">
            ×
        </button>

    </div>

    <nav class="side-menu-links">

        <a href="index.html">Home</a>

        <a href="lip-products.html">Lip Products</a>

        <a href="shades.html">Shades</a>

        <a href="skincare.html">Glow Essentials</a>

        <a href="nails.html">Press-On Nails</a>

        <a href="accessories.html">Lifestyle</a>

        <a href="contact.html">Contact</a>

        <a href="cart.html" class="side-cart-link">
            🛒 Cart
        </a>

    </nav>

</aside>

</header>

<section class="collection">

<h2>Your Shopping Cart</h2>

<p>Your selected items will appear here.</p>

<div id="cart-items">

</div>

<h3>Total: <span id="cart-total">₦0</span></h3>

<button class="clear-cart-btn" onclick="clearCart()">
Clear Cart
</button>

<button id="checkoutBtn" class="checkout-btn" onclick="window.location.href='checkout.html'">
Proceed to Checkout
</button>

</section>
<a href="https://wa.me/2349115180053"
   class="whatsapp-btn"
   target="_blank"
   aria-label="Chat with Tommy's Beauty Essentials on WhatsApp">
    💬
</a>

<script src="script.js"></script>

</body>
</html>
